<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>codeframe</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="script.js" defer></script>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-dot"></div>codeframe</div>
  <span class="topbar-hint">incolla · personalizza · esporta</span>
</div>

<div class="main">
<aside class="sb">

  <div class="sec">
    <div class="sec-title">file</div>
    <div class="field"><span>nome file</span>
      <input type="text" id="fname" value="sketch.js" oninput="setFname(this.value)">
    </div>
    <div class="field"><span>font size</span>
      <select id="fs" onchange="setFs(this.value)">
        <option value="11">11px</option><option value="12">12px</option>
        <option value="13" selected>13px</option><option value="14">14px</option>
        <option value="15">15px</option><option value="16">16px</option><option value="18">18px</option>
      </select>
    </div>
    <div class="field"><span>line height</span>
      <select id="lh" onchange="setLh(this.value)">
        <option value="1.5">1.5</option><option value="1.6">1.6</option>
        <option value="1.65" selected>1.65</option><option value="1.8">1.8</option><option value="2.0">2.0</option>
      </select>
    </div>
    <div class="field"><span>linguaggio</span>
      <select id="lang" onchange="onLang()">
        <option value="">auto (da estensione)</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="xml">HTML / XML</option>
        <option value="css">CSS</option>
        <option value="scss">SCSS</option>
        <option value="json">JSON</option>
        <option value="bash">Bash</option>
        <option value="sql">SQL</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="csharp">C#</option>
        <option value="php">PHP</option>
        <option value="ruby">Ruby</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="plaintext">Nessuno</option>
      </select>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">tema</div>
    <div class="swatches">
      <div class="swatch on" data-theme="dark"     style="background:#1e1e2e" onclick="setTheme('dark',this)"><span style="color:#44445e">dark</span></div>
      <div class="swatch"    data-theme="black"    style="background:#0d0d0d" onclick="setTheme('black',this)"><span style="color:#2a2a2a">black</span></div>
      <div class="swatch"    data-theme="charcoal" style="background:#181821" onclick="setTheme('charcoal',this)"><span style="color:#333345">char</span></div>
      <div class="swatch"    data-theme="dracula"  style="background:#282a36" onclick="setTheme('dracula',this)"><span style="color:#6272a4">drac</span></div>
      <div class="swatch"    data-theme="nord"     style="background:#2e3440" onclick="setTheme('nord',this)"><span style="color:#4c566a">nord</span></div>
      <div class="swatch sw-light" data-theme="light" style="background:#f0f0f6" onclick="setTheme('light',this)"><span style="color:#aaa">light</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">layout</div>
    <div class="field"><span>padding sfondo</span>
      <div class="srow">
        <input type="range" id="padR" min="0" max="80" value="0" step="4" oninput="setPad(this.value)">
        <span class="sval" id="padV">0</span>
      </div>
    </div>
    <div class="field"><span>larghezza</span>
      <select id="w" onchange="setW(this.value)">
        <option value="460px">stretta 460</option>
        <option value="580px">media 580</option>
        <option value="700px" selected>standard 700</option>
        <option value="860px">larga 860</option>
        <option value="100%">piena</option>
      </select>
    </div>
    <div class="trow"><span>numeri di riga</span><div class="tog on" id="togLn" onclick="togLn()"></div></div>
    <div class="trow"><span>titlebar</span><div class="tog on" id="togTb" onclick="togTb()"></div></div>
  </div>

  <div class="sec">
    <div class="sec-title">sfondo</div>
    <div class="field"><span>tipo sfondo</span>
      <select id="bg" onchange="setBg(this.value)">
        <option value="">griglia punti</option>
        <option value="bg-solid">tinta piena</option>
        <option value="bg-grad-violet">gradiente viola</option>
        <option value="bg-grad-blue">gradiente blu</option>
        <option value="bg-none">nessuno</option>
      </select>
    </div>
    <div class="hint-note">visibile solo con padding &gt; 0</div>
  </div>

  <div class="sec">
    <div class="sec-title">watermark</div>
    <div class="trow"><span>mostra</span><div class="tog" id="togWm" onclick="togWm()"></div></div>
    <div class="field"><span>testo</span>
      <input type="text" id="wmText" value="@handle" oninput="setWm()">
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">export</div>
    <div class="field"><span>risoluzione</span>
      <select id="scl" onchange="saveState()">
        <option value="1">1× normale</option>
        <option value="2" selected>2× retina</option>
        <option value="3">3× alta qualità</option>
      </select>
    </div>
  </div>

  <button class="btn" onclick="exportPNG()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v8M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/>
    </svg>
    salva PNG
  </button>
  <button class="btn btn-2" onclick="copyPNG()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v7a1 1 0 001 1h2"/>
    </svg>
    copia negli appunti
  </button>

</aside>

<div class="stage">
  <div id="export-zone">
    <div id="win" class="th-dark" style="width:700px">
      <div class="wbar" id="wbar">
        <div class="wd wd-r"></div><div class="wd wd-y"></div><div class="wd wd-g"></div>
        <div class="wname" id="wname">sketch.js</div>
        <div class="wspc"></div>
      </div>
      <div class="wbody">
        <div class="lnums" id="lnums">1</div>
        <div class="code-wrap">
          <pre class="hl"><code id="hl-code"></code></pre>
          <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
          placeholder="incolla il tuo codice qui..."
          oninput="sync()" onkeydown="htab(event)">function setup() {
  createCanvas(400, 400);
  background(0);
  noLoop();
}

function draw() {
  fill(255);
  noStroke();
  textFont('Arial');
  textSize(32);
  textAlign(CENTER, CENTER);
  text('Hello, p5.js!', width / 2, height / 2);
}</textarea>
        </div>
      </div>
    </div>
    <div id="wm" class="wm" style="display:none"></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
